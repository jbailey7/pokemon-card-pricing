[project]
name = "pokemon-card-evaluator"
version = "0.1.0"
description = "Pokémon card identifier — recognise a card from a photo and look up its market value"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28.1",
    "pandas>=2.2.0",
    "python-dotenv>=1.2.1",
    "tqdm>=4.67.3",
    "torch>=2.2.0,<=2.2.2",
    "torchvision>=0.17.0,<=0.17.2",
    "faiss-cpu>=1.10.0",
    "Pillow>=11.0.0",
    "scikit-learn>=1.6.0",
    "matplotlib>=3.10.0",
    "streamlit>=1.43.0",
]
