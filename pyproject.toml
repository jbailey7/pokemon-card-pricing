[project]
name = "pokemon-card-pricing"
version = "0.1.0"
description = "Pokémon card identifier using metric learning — fine-tuned EfficientNet-B0 with nearest-neighbour retrieval over 20k cards, plus market price lookup"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28.1",
    "python-dotenv>=1.2.1",
    "pandas>=2.2.0",
    "tqdm>=4.67.3",
    "torch>=2.2.0,<2.3.0",
    "torchvision>=0.17.0,<0.18.0",
    "numpy>=1.24.0,<2.0.0",

    "Pillow>=11.0.0",
    "scikit-learn>=1.6.0",
    "matplotlib>=3.10.0",
    "streamlit>=1.43.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

