[project]
name = "pokemon-card-pricing"
version = "0.1.0"
description = "Pokémon card identifier — recognise a card from a photo and look up its market value"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28.1",
    "pandas>=2.2.0",
    "python-dotenv>=1.2.1",
    "tqdm>=4.67.3",
    "torch>=2.5.0",
    "torchvision>=0.20.0",
    "faiss-cpu>=1.10.0",
    "Pillow>=11.0.0",
    "scikit-learn>=1.6.0",
    "matplotlib>=3.10.0",
    "streamlit>=1.43.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
